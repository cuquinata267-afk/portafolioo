name: Publicar en OCI con Ansible
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: tests
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKERHUB_USERNAME }}/portfolio-web:${{ github.sha }}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    env:
      OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      OCI_UBUNTU_IMAGE_OCID: ${{ vars.OCI_UBUNTU_IMAGE_OCID }}
      OCI_COMPUTE_PROFILE: ${{ vars.OCI_COMPUTE_PROFILE || 'trial' }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
      SSH_HOST_PRIVATE_KEY: ${{ secrets.SSH_HOST_PRIVATE_KEY }}
      SSH_HOST_PUBLIC_KEY: ${{ vars.SSH_HOST_PUBLIC_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      PORTFOLIO_DOMAIN: ${{ vars.PORTFOLIO_DOMAIN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
      CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.12.2'
          terraform_wrapper: false
      - run: python infra/prepare_ci.py
      - run: terraform -chdir=infra/terraform init -backend-config=backend.hcl
      - run: terraform -chdir=infra/terraform validate
      - name: Seleccionar capacidad e imagen en OCI
        run: |
          python -m pip install 'oci==2.192.0'
          python infra/select_oci_instance.py
      - run: terraform -chdir=infra/terraform plan -out=deploy.tfplan
      - run: terraform -chdir=infra/terraform apply -auto-approve deploy.tfplan
      - name: Preparar inventario y verificar identidad SSH
        id: server
        shell: bash
        run: |
          IP=$(terraform -chdir=infra/terraform output -raw public_ip)
          export SERVER_IP="$IP"
          python - <<'PY'
          import os, pathlib, ipaddress
          ip = str(ipaddress.IPv4Address(os.environ['SERVER_IP']))
          pathlib.Path('infra/ansible/inventory.ini').write_text('[portfolio]\n' + ip + ' ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/portfolio\n')
          pathlib.Path.home().joinpath('.ssh/known_hosts').write_text(ip + ' ' + os.environ['SSH_HOST_PUBLIC_KEY'].strip() + '\n')
          PY
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
      - run: pip install 'ansible-core>=2.17,<2.19'
      - run: ansible-playbook -i infra/ansible/inventory.ini infra/ansible/deploy.yml
      - name: Verificar acceso público al portafolio
        shell: bash
        env:
          SERVER_IP: ${{ steps.server.outputs.ip }}
        run: |
          if [[ -n "$PORTFOLIO_DOMAIN" ]]; then
            url="https://${PORTFOLIO_DOMAIN}"
          else
            url="http://${SERVER_IP}"
          fi
          for path in / /api/health; do
            status=$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
              --retry-delay 15 --max-time 20 --output /dev/null --write-out '%{http_code}' "$url$path")
            if [[ "$status" != 200 ]]; then
              printf 'Respuesta inesperada %s en %s\n' "$status" "$url$path" >&2
              exit 1
            fi
          done
          printf 'Portafolio disponible en %s\n' "$url"
          printf '### Portafolio publicado\n\n[Abrir el portafolio](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar archivos temporales con secretos
        if: always()
        run: rm -f infra/terraform/ci.auto.tfvars.json infra/terraform/deploy.tfplan ~/.oci/key.pem ~/.ssh/portfolio
